apiVersion: v1
kind: Secret
metadata:
  name: saloon-secrets
  namespace: saloon-system
type: Opaque
stringData:
  db-username: root            # change for prod
  db-password: root            # change for prod
  # Required by api-gateway/k8s/mysql-deployment (MYSQL_ROOT_PASSWORD)
  db-root-password: root       # change for prod; must match MySQL first-time init
  jwt-secret: change-me-jwt    # change for prod

