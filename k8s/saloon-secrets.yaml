apiVersion: v1
kind: Secret
metadata:
  name: saloon-secrets
  namespace: saloon-system
type: Opaque
stringData:
  db-username: root            # change for prod
  db-password: root            # change for prod
  # Must match the password MySQL was first initialized with (MYSQL_ROOT_PASSWORD).
  # If you first applied api-gateway/k8s/secrets.yaml, use rootpassword (same as key db-root-password there).
  # Fresh dev DB only from this file: set both db-password and db-root-password to the same value you want.
  db-root-password: rootpassword
  jwt-secret: change-me-jwt    # change for prod

