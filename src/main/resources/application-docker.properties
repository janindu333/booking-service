spring.application.name=booking-service

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/booking-service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug

server.port=8084

# Kafka Configuration
# Docker Compose / K8s-style service name (same network / namespace)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Spring Kafka Consumer (Optional, if using consumers)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=booking-service-group

# Zipkin / tracing (override per environment)
spring.zipkin.base-url=${SPRING_ZIPKIN_BASE_URL:http://zipkin:9411}
management.tracing.sampling.probability=1.0 
management.endpoints.web.exposure.include=health,info,env,metrics
management.endpoint.health.show-details=always
