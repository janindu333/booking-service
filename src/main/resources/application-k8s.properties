spring.application.name=booking-service

# Database (external MySQL, not a pod)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:host.docker.internal}:3306/saloon-service?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug

server.port=8084

# Service discovery via Kubernetes/CoreDNS
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.healthcheck.enabled=false

# CoreDNS service URL for payment-service Feign client
payment.service.url=${PAYMENT_SERVICE_URL:http://payment-service:8086}

# Kafka & Zipkin via K8s services
spring.kafka.bootstrap-servers=kafka-service.saloon-system.svc.cluster.local:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=booking-service-group

# Distributed tracing (OpenTelemetry -> Tempo OTLP)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo.observability.svc.cluster.local:4318/v1/traces
management.tracing.propagation.type=w3c
management.endpoints.web.exposure.include=health,info,env,metrics
management.endpoint.health.show-details=always

# JWT secret from environment
jwt.secret=${JWT_SECRET:change-me-jwt}
